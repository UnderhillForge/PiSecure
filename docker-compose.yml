# Not the install path. Use pisecured on Debian with systemd.
services:
  pisecure:
    build:
      context: .
      dockerfile: Dockerfile
    image: pisecure:validator
    container_name: pisecure-validator
    restart: unless-stopped
    environment:
      PISECURE_VALIDATE_ONLY: "1"
      PISECURE_DATA_DIR: /var/lib/pisecure
      PISECURE_CONFIG_DIR: /etc/pisecure
      PISECURE_API_HOST: 0.0.0.0
      PISECURE_API_PORT: "3142"
      PISECURE_BOOTSTRAP_URL: ${PISECURE_BOOTSTRAP_URL:-https://bootstrap.pisecure.org}
      PISECURE_LOG_LEVEL: ${PISECURE_LOG_LEVEL:-INFO}
    ports:
      - "3142:3142"
      - "3144:3144"
      - "5000:5000"
    volumes:
      - pisecure-data:/var/lib/pisecure
      - pisecure-config:/etc/pisecure
    healthcheck:
      test: ["CMD", "pisecure", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pisecure-data:
  pisecure-config:
