[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pisecure"
version = "0.1.0"
description = "Decentralized Security Framework for Raspberry Pi"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "J Stekervetz", email = "mr_underhill@icloud.com"}
]
maintainers = [
    {name = "J Stekervetz", email = "mr_underhill@icloud.com"}
]
keywords = [
    "raspberry-pi",
    "blockchain",
    "security",
    "iot",
    "cryptography",
    "hardware-security",
    "ota-updates",
    "device-identity"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: Python :: 3.9",
    "Programming Language :: Python :: Python :: 3.10",
    "Programming Language :: Python :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Hardware",
    "Topic :: Internet :: WWW/HTTP"
]
requires-python = ">=3.7"
dependencies = [
    "cryptography>=41.0.0",
    "PyNaCl>=1.5.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0"
]
hardware = [
    "RPi.GPIO>=0.7.0",
    "gpiozero>=2.0"
]
ipfs = [
    "ipfshttpclient>=0.8.0"
]
tpm = [
    "tpm2-pytss>=1.2.0"
]
full = [
    "ipfshttpclient>=0.8.0",
    "RPi.GPIO>=0.7.0",
    "gpiozero>=2.0",
    "tpm2-pytss>=1.2.0",
    "paho-mqtt>=1.6.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0"
]

[project.scripts]
pisecure = "pisecure.cli:main"

[project.urls]
Homepage = "https://github.com/UnderhillForge/PiSecure"
Documentation = "https://pisecure.readthedocs.io/"
Repository = "https://github.com/UnderhillForge/PiSecure"
Issues = "https://github.com/UnderhillForge/PiSecure/issues"
Changelog = "https://github.com/UnderhillForge/PiSecure/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pisecure"]
include-package-data = true

[tool.setuptools.package-data]
pisecure = ["docs/*", "examples/*"]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cryptography.*",
    "RPi.*",
    "gpiozero.*",
    "ipfshttpclient.*",
    "tpm2.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra -q --cov=pisecure --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["pisecure"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod"
]