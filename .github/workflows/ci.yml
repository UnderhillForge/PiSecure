name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ pkg-config libssl-dev libwebsockets-dev libcurl4-openssl-dev nlohmann-json3-dev
      - name: Build pisecured and pswallet
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2 --target pisecured pswallet
          ./build/cpp/pisecured/header_frame_test
